<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070d18"><title>ROAD TO GOAL</title>
<style>
:root{--bg:#070d18;--panel:#0d1727;--panel2:#111f33;--text:#f7fbff;--muted:#8da1b8;--gold:#ffd166;--line:#1b3049;--green:#52d68b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#17345a 0,transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-weight:1000;font-size:26px;letter-spacing:2px}.tag{color:var(--gold);font-size:12px;font-weight:900;letter-spacing:1px}.profile{background:var(--panel);border:1px solid var(--line);padding:9px 14px;border-radius:14px;color:#cbd8e5}
.nav{display:flex;gap:8px;overflow:auto;margin-bottom:20px}.nav button{background:transparent;border:1px solid var(--line);color:#9db0c5;padding:10px 15px;border-radius:12px;white-space:nowrap}.nav button.active{background:var(--gold);color:#07111f;border-color:var(--gold);font-weight:900}
.grid{display:grid;grid-template-columns:1.6fr .8fr;gap:18px}.hero{border:1px solid #25415f;border-radius:28px;padding:30px;background:linear-gradient(145deg,#17395f,#0d1b2c 65%);box-shadow:0 25px 70px #0005}.eyebrow{color:var(--muted);font-size:13px}.hero h1{font-size:42px;margin:7px 0}.hero p{color:#a9bbce;margin:0 0 25px}.progress{height:13px;background:#27445f;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--gold);width:18%;border-radius:99px}.herofoot{display:flex;justify-content:space-between;margin-top:10px;color:var(--gold);font-weight:900}.bigrow{display:flex;align-items:end;gap:9px;margin:18px 0}.big{font-size:72px;line-height:.9;font-weight:1000}.small{color:var(--muted);font-size:20px;margin-bottom:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:15px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}.stat .ico{font-size:21px}.stat b{font-size:27px;display:block;margin-top:5px}.stat span{font-size:12px;color:var(--muted)}
.side{display:grid;gap:14px}.quote{background:linear-gradient(145deg,#332b15,#15191d);border:1px solid #594b25}.quote .q{font-size:26px;line-height:1.25;font-weight:900;margin:12px 0}.gold{color:var(--gold)}.level{font-size:35px;font-weight:1000}.xp{height:8px;background:#283748;border-radius:99px;overflow:hidden}.xp i{display:block;width:64%;height:100%;background:var(--gold)}
.actions{display:flex;gap:10px;margin-top:17px}.primary,.secondary{border:0;border-radius:17px;padding:15px 20px;font-weight:900;font-size:15px}.primary{background:var(--gold);color:#07111f;flex:1}.secondary{background:#142338;color:#dce6ef;border:1px solid var(--line)}
.section{margin-top:20px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section h2{font-size:20px;margin:0}.muted{color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}.cell{aspect-ratio:1;border-radius:4px;background:#152438}.cell.on{background:#d4a93f}.cell.hot{background:var(--gold)}
.milestones{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.mile{padding:12px 7px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:15px;color:var(--muted);font-size:11px}.mile.done{color:var(--gold);border-color:#705c24}.mile b{display:block;color:#fff;font-size:18px;margin-bottom:3px}
.page{display:none}.page.active{display:block}.list{display:grid;gap:9px}.work{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);padding:15px 17px;border-radius:17px}.work strong{display:block}.work small{color:var(--muted)}.pill{color:var(--green);font-weight:900}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{max-width:470px;width:100%;background:#0b1726;border:1px solid var(--line);border-radius:25px;padding:23px}.box h2{margin-top:0}.box label{display:block;color:#9db0c5;font-size:13px;margin:13px 0 6px}.box input,.box select,.box textarea{width:100%;background:#0e1d30;border:1px solid #23405c;color:#fff;border-radius:13px;padding:13px;font:inherit}.box textarea{min-height:90px;resize:vertical}.close{float:left;background:none;border:0;color:#8da1b8;font-size:20px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#142a43;border:1px solid #2b4d6e;padding:12px 18px;border-radius:99px;display:none;font-weight:800}.toast.show{display:block}
@media(max-width:800px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.hero h1{font-size:34px}.big{font-size:60px}.milestones{grid-template-columns:repeat(3,1fr)}.heat{grid-template-columns:repeat(10,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div><div class="tag">DISCIPLINE • CONSISTENCY • GROWTH</div><div class="brand">ROAD TO GOAL</div></div><div class="profile">👤 האלוף שלי</div></header>
<nav class="nav"><button class="active" onclick="tab('home',this)">🏠 ראשי</button><button onclick="tab('journal',this)">📅 יומן</button><button onclick="tab('achievements',this)">🏆 הישגים</button><button onclick="tab('stats',this)">📊 סטטיסטיקות</button><button onclick="openGoal()">🎯 מטרה חדשה</button></nav>

<section id="home" class="page active">
<div class="grid"><main>
<div class="hero"><div class="eyebrow">המשימה הגדולה שלך</div><h1 id="goal">ליגת העל</h1><p>200 אימונים. צעד אחרי צעד. עד שהחלום הופך למציאות.</p>
<div class="bigrow"><div class="big" id="done">0</div><div class="small">/ <span id="target">200</span> אימונים</div></div>
<div class="progress"><i id="bar"></i></div><div class="herofoot"><span id="pct">0%</span><span>המטרה עדיין לפניך.</span></div>
<div class="actions"><button class="primary" onclick="addWorkout()">✓ סיימתי אימון</button><button class="secondary" onclick="openWorkout()">＋ פרטי אימון</button></div></div>
<div class="stats"><div class="stat"><div class="ico">🔥</div><b id="streak">0</b><span>רצף ימים</span></div><div class="stat"><div class="ico">⚡</div><b id="xp">0</b><span>XP</span></div><div class="stat"><div class="ico">🏋️</div><b id="left">200</b><span>אימונים נשארו</span></div></div>
<div class="section"><div class="sectionhead"><h2>עקביות</h2><span class="muted">90 ימים אחרונים</span></div><div class="card"><div class="heat" id="heat"></div></div></div>
