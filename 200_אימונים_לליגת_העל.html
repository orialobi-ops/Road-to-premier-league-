<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>200 אימונים → ליגת העל</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--accent:#16a34a;--accent2:#22c55e;--line:#e5e7eb}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#111827 0 190px,var(--bg) 190px);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text)}
.app{max-width:680px;margin:auto;padding:22px 16px 40px}.hero{color:white;padding:8px 4px 26px}.hero h1{font-size:30px;margin:0 0 6px;font-weight:850}.hero p{margin:0;color:#d1d5db}.card{background:var(--card);border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
.progress-head{display:flex;justify-content:space-between;align-items:end}.num{font-size:42px;font-weight:900;line-height:1}.small{color:var(--muted);font-size:14px}.bar{height:14px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:18px 0 10px}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.3s}.goal{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
button{border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:white;width:100%;margin-top:12px}.secondary{background:#eef2ff;color:#3730a3;width:100%;margin-top:10px}.danger{background:#fee2e2;color:#991b1b}.row{display:flex;gap:10px}.row>*{flex:1}label{display:block;font-weight:750;margin:12px 0 6px}input,textarea,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}textarea{min-height:90px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;background:#f0fdf4;border:1px solid #bbf7d0;padding:12px;border-radius:12px;margin-top:12px}.check input{width:auto}
.history h2{margin-top:0}.item{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.badge{min-width:42px;height:42px;border-radius:12px;background:#dcfce7;color:#166534;display:grid;place-items:center;font-weight:900}.item b{display:block}.item span{font-size:13px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:20px 0}
.quote{text-align:center;font-weight:800;font-size:18px}.goalbox{background:#111827;color:white}.goalbox .muted{color:#cbd5e1}.goalbox strong{font-size:24px}
@media(max-width:420px){.hero h1{font-size:26px}.num{font-size:36px}}
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <h1>200 אימונים → ליגת העל 🏆</h1>
    <p>כל אימון הוא עוד צעד בדרך למטרה.</p>
  </section>

  <section class="card">
    <div class="progress-head">
      <div><div class="small">התקדמות</div><div class="num"><span id="count">0</span><span class="small"> / 200</span></div></div>
      <div class="small" id="percent">0%</div>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="goal"><span>התחלה</span><span>ליגת העל 🏆</span></div>
  </section>

  <section class="card goalbox">
    <div class="small muted">המטרה</div>
    <strong>להשלים 200 אימונים</strong>
    <p class="muted">כשמגיעים ל־200 — חוגגים את הדרך ומציבים את היעד הבא.</p>
  </section>

  <section class="card">
    <h2 style="margin-top:0">הוסף אימון</h2>
    <div class="row">
      <div><label for="date">תאריך</label><input id="date" type="date"></div>
      <div><label for="type">סוג אימון</label>
        <select id="type"><option>כדורגל</option><option>כושר</option><option>מהירות</option><option>טכניקה</option><option>כוח</option><option>משחק</option><option>אחר</option></select>
      </div>
    </div>
    <label for="notes">מה עשיתי היום?</label>
    <textarea id="notes" placeholder="לדוגמה: שעה וחצי, בעיטות, ספרינטים ומשחק..."></textarea>
    <label class="check"><input id="great" type="checkbox"> <span>זה היה אימון חזק במיוחד 💪</span></label>
    <button class="primary" onclick="addWorkout()">סיימתי אימון +1</button>
  </section>

  <section class="card history">
    <h2>האימונים שלי</h2>
    <div id="history"></div>
    <button class="secondary" onclick="exportData()">שמור גיבוי של האימונים</button>
    <button class="danger" onclick="resetAll()" style="margin-top:10px">איפוס הכל</button>
  </section>

  <section class="card quote">״לא מחפשים קיצור דרך. בונים את הדרך — אימון אחרי אימון.״</section>
</div>

<script>
const KEY="league200_workouts_v1";
let workouts=JSON.parse(localStorage.getItem(KEY)||"[]");
const $=id=>document.getElementById(id);
$("date").value=new Date().toISOString().slice(0,10);

function save(){localStorage.setItem(KEY,JSON.stringify(workouts));render()}
function addWorkout(){
  if(workouts.length>=200){alert("השלמת כבר 200 אימונים! 🏆");return}
  workouts.push({date:$("date").value||new Date().toISOString().slice(0,10),type:$("type").value,notes:$("notes").value.trim(),great:$("great").checked,id:Date.now()});
  $("notes").value="";$("great").checked=false;save();
}
function render(){
  const n=workouts.length, p=Math.round(n/200*100);
  $("count").textContent=n;$("percent").textContent=p+"%";$("fill").style.width=p+"%";
  const h=$("history");
  if(!n){h.innerHTML='<div class="empty">עדיין אין אימונים. היום מתחילים. 🔥</div>';return}
  h.innerHTML=[...workouts].reverse().map((w,i)=>`
    <div class="item">
      <div class="badge">${n-i}</div>
      <div style="flex:1"><b>${escapeHtml(w.type)} ${w.great?"💪":""}</b><span>${formatDate(w.date)}${w.notes?" · "+escapeHtml(w.notes):""}</span></div>
    </div>`).join("");
}
function formatDate(s){if(!s)return"";return new Date(s+"T12:00:00").toLocaleDateString("he-IL",{day:"2-digit",month:"2-digit",year:"numeric"})}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function resetAll(){if(confirm("למחוק את כל 200 האימונים שנשמרו במכשיר?")){workouts=[];save()}}
function exportData(){
  const blob=new Blob([JSON.stringify(workouts,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="200-אימונים-גיבוי.json";a.click();URL.revokeObjectURL(a.href);
}
render();
</script>
</body>
</html>
